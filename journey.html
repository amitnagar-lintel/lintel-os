<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Journey Plan · Lintel Space Atelier</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D0D27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0D0D27; --gold:#DFB05E; --gold-l:#E9C883; --paper:#F6F1E7; --line:#E7E2D8; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{ background:#ECE4D6; color:#14142A;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-text-size-adjust:100%; }

  .top{ background:var(--navy); border-bottom:3px solid var(--gold); color:#F7F2E9;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom,0));
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
  .brand{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; letter-spacing:2px; text-transform:uppercase }
  .brand small{ display:block; font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:2.4px; text-transform:uppercase; color:var(--gold); opacity:.95; font-weight:400; margin-top:2px }
  .top .sp{flex:1}
  .btn{ appearance:none; border:1px solid rgba(212,168,92,.55); background:transparent; color:var(--gold-l);
    font:500 12px 'IBM Plex Mono',monospace; letter-spacing:1px; text-transform:uppercase;
    padding:9px 15px; border-radius:8px; cursor:pointer; white-space:nowrap; min-height:40px; }
  .btn:active{background:rgba(212,168,92,.16)}

  .wrap{ max-width:980px; margin:16px auto 48px; padding:0 12px }
  #sheet{ width:100%; background:var(--paper); border-radius:14px; overflow:hidden; box-shadow:0 18px 50px -24px rgba(13,13,39,.45) }
  #sheet:empty{ min-height:200px }
  .state{ padding:56px 24px; text-align:center; color:#6b6b7a }
  .state h2{ font-family:'Fraunces',serif; font-size:22px; color:var(--navy); margin:0 0 8px }
  .spin{ width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; margin:0 auto 16px; animation:sp .8s linear infinite }
  @keyframes sp{ to{transform:rotate(360deg)} }
  .foot{ text-align:center; font-size:11.5px; color:#8a8a99; padding:18px 14px 0; line-height:1.7 }
  .foot a{ color:#6b6b7a }

  @media print{
    .top,.foot,.noprint{ display:none!important }
    body{ background:#fff }
    .wrap{ margin:0; padding:0; max-width:none }
    #sheet{ box-shadow:none; border-radius:0 }
    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">Lintel Space Atelier<small>Where Luxury Meets Functionality</small></div>
  <div class="sp"></div>
  <button class="btn noprint" id="printBtn" style="display:none">⬇ Save as PDF</button>
</div>

<div class="wrap">
  <div id="sheet"></div>
  <div class="state" id="state"><div class="spin"></div>Loading your journey plan…</div>
  <div class="foot">
    Questions? Reply to the message, or write to <a href="mailto:contact@lintelspace.com">contact@lintelspace.com</a>.<br>
    © Lintel Space Atelier · www.lintelspace.com
  </div>
</div>

<script>
(function(){
  var FN = "https://cxgxmqspvpuizvwfbnjq.supabase.co/functions/v1/journey-view";
  var stateEl = document.getElementById("state");
  var sheetEl = document.getElementById("sheet");
  var printBtn = document.getElementById("printBtn");

  function fail(title, msg){ sheetEl.innerHTML = ""; stateEl.innerHTML = "<h2>" + title + "</h2>" + msg; }

  var token = new URLSearchParams(location.search).get("t");
  if(!token){ return fail("Link incomplete", "This journey link looks incomplete. Please use the link that was shared with you."); }

  fetch(FN + "?t=" + encodeURIComponent(token), { headers:{ "Accept":"application/json" } })
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      if(!res.ok || !res.j || res.j.error || !res.j.html){
        var e = (res.j && res.j.error) || "This journey link is no longer valid.";
        return fail("Journey plan unavailable", e + "<br><br>Please contact your design consultant for an up-to-date copy.");
      }
      stateEl.style.display = "none";
      sheetEl.innerHTML = res.j.html;
      if(res.j.title) document.title = res.j.title + " · Lintel Space Atelier";
      printBtn.style.display = "";
    })
    .catch(function(){ fail("Could not load the journey plan", "Please check your connection and try again."); });

  printBtn.onclick = function(){ window.print(); };
})();
</script>
</body>
</html>
