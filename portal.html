<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Your home · Lintel Space Atelier</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0D0D27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0D0D27;--brass:#DFB05E;--brassd:#946F33;--ink:#23233F;--soft:#6B6560;--grey:#9A9490;--line:#E7E2D8;--paper:#FBFAF7;--green:#2E7D5B;--red:#A33C3C;--amber:#B7791F}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:#F3F1EC;color:var(--ink);font-family:Inter,-apple-system,sans-serif;-webkit-text-size-adjust:100%;padding-bottom:74px}
  .top{background:var(--navy);border-bottom:3px solid var(--brass);padding:14px 18px;color:#F7F2E9;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:14px;letter-spacing:2.5px;text-transform:uppercase;font-weight:500}
  .brand small{display:block;font-size:8px;letter-spacing:2.6px;text-transform:uppercase;color:var(--brass);margin-top:2px;font-weight:400}
  .code{font-size:11px;color:var(--brass);letter-spacing:1px;white-space:nowrap}
  .wrap{max-width:640px;margin:14px auto 0;padding:0 14px}
  .card{background:#fff;border-radius:14px;box-shadow:0 14px 40px -24px rgba(13,13,39,.35);padding:18px;margin-bottom:12px}
  h1{font-family:'Bricolage Grotesque',Inter,sans-serif;font-size:22px;margin:0 0 4px;color:var(--navy);letter-spacing:-.01em}
  h2{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--grey);text-transform:uppercase;margin:0 0 4px}
  .rule{width:28px;height:2px;background:var(--brass);margin-bottom:12px}
  .sub{font-size:13px;color:var(--soft);line-height:1.6}
  .chip{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:700;background:#FFF6E2;color:var(--brassd);border:1px solid var(--brass)}
  .chip.green{background:#EEF6EF;color:var(--green);border-color:#9CC7A6}
  .chip.grey{background:#F1EFEA;color:var(--soft);border-color:var(--line)}
  /* tabs */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab{flex:1;border:none;background:none;font:600 10.5px Inter;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;cursor:pointer;position:relative}
  .tab .ic{font-size:18px;line-height:1}
  .tab.on{color:var(--navy)} .tab.on .ic{transform:translateY(-1px)}
  .tab .dot{position:absolute;top:2px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
  .tab.has .dot{display:block}
  @media(min-width:700px){ body{padding-bottom:20px} .tabs{position:static;max-width:640px;margin:0 auto 12px;border:1px solid var(--line);border-radius:12px;padding:6px} .wrap{margin-top:14px} }
  /* progress */
  .pbar{height:8px;border-radius:6px;background:#EFEAE0;overflow:hidden;margin:10px 0 6px}
  .pbar>div{height:100%;background:linear-gradient(90deg,var(--brass),#C89440);border-radius:6px;transition:width .5s}
  .now{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}
  .now .big{font-size:26px;line-height:1}
  .now b{display:block;font-size:13.5px;color:var(--navy)} .now span{font-size:12px;color:var(--soft);line-height:1.5}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .qbtn{border:1px solid var(--line);border-radius:11px;padding:12px 10px;background:#fff;font:600 12.5px Inter;color:var(--navy);cursor:pointer;text-align:left;display:flex;gap:8px;align-items:center;text-decoration:none}
  .qbtn.primary{background:var(--navy);color:var(--brass);border-color:var(--navy)}
  .tl-row{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
  .tl-dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid var(--line);background:var(--paper);color:var(--grey)}
  .tl-row.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff}
  .tl-row.now .tl-dot{background:var(--brass);border-color:var(--brass);color:var(--navy)}
  .tl-nm{font-size:13.5px;font-weight:600;padding-top:2px} .tl-row.done .tl-nm{color:var(--green)} .tl-row.now .tl-nm{color:var(--brassd)}
  .tl-dt{font-size:11px;color:var(--grey);padding-top:3px;margin-left:auto;white-space:nowrap}
  /* consultant card */
  .person{display:flex;gap:12px;align-items:center}
  .av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--brass);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
  .person b{display:block;font-size:14px} .person span{font-size:12px;color:var(--soft)}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .lbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--brassd);border:1px solid var(--brass);border-radius:8px;padding:7px 12px;text-decoration:none;cursor:pointer;background:#fff}
  .lbtn.pay,.lbtn.dark{background:var(--navy);color:var(--brass);border-color:var(--navy)}
  /* payments */
  .mrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)} .mrow:first-of-type{border-top:none}
  .m-ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
  .m-ic.paid{background:#EEF6EF;color:var(--green)} .m-ic.due{background:#FFF6E2;color:var(--brassd)} .m-ic.later{background:#F1EFEA;color:var(--grey)}
  .m-nm{flex:1;min-width:0} .m-nm b{font-size:13.5px;display:block} .m-nm span{font-size:11px;color:var(--grey)}
  .m-amt{font-size:13.5px;font-weight:700;white-space:nowrap}
  .m-act{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid var(--line)} .kv:first-of-type{border-top:none}
  .kv b{color:var(--navy)}
  /* team + messages */
  .team{display:flex;flex-direction:column;gap:8px}
  .tm{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer}
  .tm:hover,.tm.on{border-color:var(--brass);background:#FFF9EA}
  .tm .av{width:38px;height:38px;font-size:12px}
  .tm b{display:block;font-size:13.5px} .tm span{font-size:11.5px;color:var(--grey)}
  .tm .go{margin-left:auto;color:var(--brassd);font-size:18px}
  .msgs{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding:4px 0 10px}
  .msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;word-break:break-word}
  .msg.client{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .msg.staff{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg .who{font-size:10.5px;font-weight:700;color:var(--brassd);margin-bottom:2px} .msg.client .who{color:var(--brass)}
  .msg .ts{display:block;font-size:9.5px;opacity:.55;margin-top:3px;text-align:right}
  .to-sel{font-size:12px;color:var(--soft);margin-bottom:6px}
  select,textarea,input[type=text]{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);color:var(--ink);outline:none;width:100%}
  select:focus,textarea:focus,input:focus{border-color:var(--brass);background:#fff}
  .to-sel select{width:auto;padding:5px 8px;font-size:12.5px;border-radius:8px;background:#fff}
  .composer{display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;resize:none;min-height:42px;max-height:110px}
  .composer button{border:none;border-radius:10px;background:var(--navy);color:var(--brass);width:44px;height:42px;font-size:16px;cursor:pointer;flex:none}
  .btn{width:100%;border:none;border-radius:11px;padding:13px;font:600 14.5px Inter;background:var(--navy);color:#fff;cursor:pointer;margin-top:10px}
  .btn:disabled{opacity:.55}
  .field{margin-bottom:10px} .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--grey);text-transform:uppercase;margin-bottom:5px}
  /* support */
  .wrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px} .wrow:first-of-type{border-top:none}
  .wrow b{display:block;font-size:13px;color:var(--navy)} .wrow span{font-size:11.5px;color:var(--grey)}
  .wrow .exp{text-align:right;white-space:nowrap;font-size:12px;color:var(--soft)}
  .tk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#fff}
  .tk-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .tk-h b{font-size:13.5px;color:var(--navy)} .tk-h small{display:block;font-size:11px;color:var(--grey);margin-top:2px}
  .st{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .st.open{background:#FFF6E2;color:var(--brassd)} .st.ack,.st.in_progress{background:#EAF0F6;color:#3F6A96} .st.resolved,.st.closed{background:#EEF6EF;color:var(--green)}
  .steps{display:flex;gap:4px;margin:10px 0 6px}
  .steps i{flex:1;height:5px;border-radius:3px;background:#EFEAE0} .steps i.on{background:var(--brass)} .steps i.done{background:var(--green)}
  .ev{font-size:12px;color:var(--soft);padding:4px 0;border-top:1px dashed var(--line)} .ev b{color:var(--ink);font-weight:600}
  .pin{display:flex;gap:8px;justify-content:center;margin:14px 0}
  .pin input{width:52px;height:56px;text-align:center;font:700 22px Inter;border:1.5px solid var(--line);border-radius:10px;outline:none;background:var(--paper);padding:0}
  .err{color:var(--red);font-size:12.5px;text-align:center;min-height:16px;margin-top:6px}
  .ok{color:var(--green);font-size:12.5px;text-align:center;min-height:16px;margin-top:6px}
  .state{padding:46px 18px;text-align:center;color:var(--soft)}
  .spin{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center;font-size:11.5px;color:#8a8a99;padding:8px 14px 20px;line-height:1.7} .foot a{color:var(--brassd);text-decoration:none}
  .jframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .empty{text-align:center;padding:26px 12px;color:var(--soft);font-size:13px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#EFEAE0;cursor:pointer}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph span{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
  .doc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)} .doc:first-of-type{border-top:none}
  .doc .ic{width:36px;height:36px;border-radius:9px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .doc b{display:block;font-size:13px} .doc span{font-size:11px;color:var(--grey)}
  .ap{border:1px solid var(--brass);background:#FFF9EA;border-radius:12px;padding:14px;margin-bottom:10px}
  .ap.done{border-color:var(--line);background:#fff}
  .ap b{display:block;font-size:14px;color:var(--navy)} .ap .sub{margin:4px 0 8px}
  .ap img{width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:#F3F1EC;margin-bottom:8px}
  .ap .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ap .row button{flex:1;border-radius:9px;padding:11px;font:600 13px Inter;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .ap .row button.yes{background:var(--green);color:#fff;border-color:var(--green)}
  .sign{border:1px solid var(--brass);background:#FFF9EA;border-radius:12px;padding:14px}
  .empty .big{font-size:34px;margin-bottom:6px}
</style>
</head>
<body>
<div class="top"><div class="brand">Lintel Space Atelier<small>Where luxury meets functionality</small></div><div class="code" id="hdrCode"></div></div>
<div class="wrap" id="wrap"><div class="card"><div class="state"><div class="spin"></div>Opening your home…</div></div></div>
<div class="foot">Your Lintel team is one message away · <a href="mailto:contact@lintelspace.com">contact@lintelspace.com</a> · +91 99165 58777<br>© Lintel Space Atelier · lintelspace.com</div>
<nav class="tabs" id="tabs" style="display:none">
  <button class="tab on" data-tab="home"><span class="ic">🏠</span>Home<i class="dot"></i></button>
  <button class="tab" data-tab="journey"><span class="ic">🗺️</span>Journey<i class="dot"></i></button>
  <button class="tab" data-tab="gallery"><span class="ic">🖼️</span>Gallery<i class="dot"></i></button>
  <button class="tab" data-tab="payments"><span class="ic">💳</span>Payments<i class="dot"></i></button>
  <button class="tab" data-tab="team"><span class="ic">💬</span>Team<i class="dot"></i></button>
  <button class="tab" data-tab="support"><span class="ic">🛡️</span>Support<i class="dot"></i></button>
</nav>
<script>
(function(){
  var FN="https://cxgxmqspvpuizvwfbnjq.supabase.co/functions/v1/portal";
  var token=new URLSearchParams(location.search).get("t")||"";
  var wrap=document.getElementById("wrap"), tabsEl=document.getElementById("tabs");
  var PIN=sessionStorage.getItem("lsa_pin_"+token)||"";
  var TAB=sessionStorage.getItem("lsa_tab_"+token)||"home";
  var D=null, pendingTo=null;
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};
  var inr=function(n){n=Math.round(Number(n)||0);return "₹"+n.toLocaleString("en-IN");};
  var dS=function(d){if(!d)return "";var x=new Date(String(d).length<=10?d+"T00:00:00":d);return isNaN(+x)?"":x.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});};
  var tS=function(d){var x=new Date(d);var today=new Date().toDateString()===x.toDateString();return (today?"":x.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" ")+x.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});};
  var ini=function(n){return String(n||"").split(/\s+/).slice(0,2).map(function(x){return x[0]||"";}).join("").toUpperCase();};
  var STAGE_HINT={"Briefing":"We're capturing your requirements, lifestyle and wishlist in detail.","Design":"Your designer is turning the brief into concepts, layouts and 3D views for your approval.","Proposal/BOQ":"Your detailed bill of quantities and proposal are being finalised.","Production":"Your modular units are being manufactured in our factory to the approved drawings.","Installation":"Our site team is installing and finishing your home.","Handover":"Final checks, snag clearance and your warranty activation."};
  var CAT_LABEL={warranty_claim:"Warranty claim",service_request:"Service request",complaint:"Complaint",general:"General query"};
  var ST_LABEL={open:"Received",ack:"Acknowledged",in_progress:"In progress",resolved:"Resolved",closed:"Closed"};
  var ST_STEP={open:1,ack:2,in_progress:3,resolved:4,closed:4};
  function fail(t,m){wrap.innerHTML='<div class="card"><div class="state"><h1>'+esc(t)+'</h1><div class="sub">'+esc(m)+'</div></div></div>';}
  if(!token) return fail("Link incomplete","Please open the link exactly as shared by your Lintel team.");
  function post(body){ return fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({t:token,pin:PIN},body))}).then(function(r){return r.json();}); }
  function load(){
    return fetch(FN+"?t="+encodeURIComponent(token)+(PIN?"&pin="+encodeURIComponent(PIN):""))
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){ if(!res.ok||res.j.error) throw new Error(res.j.error||"Could not load"); D=res.j; render(); })
      .catch(function(e){ fail("We couldn't open your home", e.message||"Please check your connection and try again."); });
  }

  // ---------- shared pieces ----------
  function pinCard(what){
    return '<div class="card"><h2>'+esc(what)+'</h2><div class="rule"></div>'
      +'<div class="sub" style="text-align:center">To keep your details private, enter the <b>last 4 digits of your registered mobile number</b>.</div>'
      +'<div class="pin">'+[0,1,2,3].map(function(i){return '<input inputmode="numeric" maxlength="1" id="pin'+i+'">';}).join("")+'</div>'
      +'<button class="btn" id="pinGo" style="margin-top:0">Unlock</button><div class="err" id="pinErr"></div></div>';
  }
  function bindPin(){
    var ins=[0,1,2,3].map(function(i){return document.getElementById("pin"+i);}); if(!ins[0]) return;
    ins.forEach(function(el,i){ el.oninput=function(){ el.value=el.value.replace(/\D/g,""); if(el.value&&i<3) ins[i+1].focus(); if(i===3&&el.value) document.getElementById("pinGo").click(); };
      el.onkeydown=function(e){ if(e.key==="Backspace"&&!el.value&&i>0) ins[i-1].focus(); }; });
    ins[0].focus();
    document.getElementById("pinGo").onclick=function(){
      var pin=ins.map(function(el){return el.value;}).join(""); if(pin.length<4){document.getElementById("pinErr").textContent="Enter all 4 digits";return;}
      PIN=pin; sessionStorage.setItem("lsa_pin_"+token,pin);
      load().then(function(){ if(D&&!D.unlocked){ PIN=""; sessionStorage.removeItem("lsa_pin_"+token); var e=document.getElementById("pinErr"); if(e) e.textContent="That didn't match — use the last 4 digits of the mobile number we have on file."; } });
    };
  }
  function invoiceHtml(pi){
    var today=dS(pi.created_at)||dS(new Date().toISOString());
    return '<div style="font-family:Georgia,serif;max-width:720px;margin:0 auto;color:#1a1a1a"><div style="background:#0D0D27;color:#fff;padding:22px 30px;display:flex;justify-content:space-between"><div><div style="font-size:12px;letter-spacing:3px;color:#DFB05E">LINTEL SPACE ATELIER</div><div style="font-size:11px;color:#9CA0B0;margin-top:6px;line-height:1.5">Survey No.36/4, site no.25 to 30, Ground Floor,<br>Ramky House, Kalyan Nagar, Bengaluru 560043<br>+91 9916558777 · contact@lintelspace.com</div></div><div style="text-align:right"><div style="font-size:19px;letter-spacing:1px">PROFORMA INVOICE</div><div style="font-size:13px;color:#DFB05E;margin-top:6px">'+esc(pi.pi_number)+'</div><div style="font-size:12px;color:#9CA0B0;margin-top:4px">'+esc(today)+'</div></div></div>'
      +'<div style="padding:24px 30px"><div style="font-size:11px;color:#8A8FA3;text-transform:uppercase;margin-bottom:4px">Bill To</div><div style="font-size:15px;font-weight:600">'+esc(pi.client_name||"")+'</div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:14px;margin:18px 0"><thead><tr style="background:#F6F4EF;text-align:left"><th style="padding:11px 12px;font-size:12px;color:#8A8FA3">DESCRIPTION</th><th style="padding:11px 12px;font-size:12px;color:#8A8FA3;text-align:right">AMOUNT</th></tr></thead><tbody><tr style="border-bottom:1px solid #ECECEC"><td style="padding:14px 12px">'+esc(pi.milestone_label||pi.remark||"Milestone payment")+'</td><td style="padding:14px 12px;text-align:right;font-weight:600">'+inr(pi.amount)+'</td></tr></tbody></table>'

    if(send) send.onclick=function(){
      var body=txt.value.trim(); if(!body||sending) return; sending=true; send.disabled=true; txt.disabled=true;
      var toSel=document.getElementById("pTo"), toId=toSel?toSel.value:"", toName=toSel&&toSel.value?toSel.options[toSel.selectedIndex].textContent.split(" · ")[0]:"";
      var m=document.createElement("div"); m.className="msg client"; m.innerHTML='<div class="who">You'+(toName?" → "+esc(toName):"")+'</div>'+esc(body).replace(/\n/g,"<br>")+'<span class="ts">sending…</span>';
      var emp=box.querySelector(".empty"); if(emp) emp.remove(); box.appendChild(m); box.scrollTop=box.scrollHeight; txt.value="";
      post({action:"message",body:body,to_member_id:toId||null}).then(function(j){ sending=false; send.disabled=false; txt.disabled=false; txt.focus();
        if(j.error){ err.textContent=j.error; m.remove(); txt.value=body; return; } err.textContent=""; m.querySelector(".ts").textContent=tS(new Date().toISOString());
      }).catch(function(){ sending=false; send.disabled=false; txt.disabled=false; err.textContent="Network error — try again"; m.remove(); txt.value=body; });
    };
    if(txt) txt.onkeydown=function(e){ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.onclick();} };
    var cat=document.getElementById("tkCat"); if(cat){ var wc=document.getElementById("tkWcWrap"); var sync=function(){ wc.style.display=(cat.value==="warranty_claim"||cat.value==="service_request")?"":"none"; }; cat.onchange=sync; sync(); }
    var go=document.getElementById("tkGo"); if(go) go.onclick=function(){
      var e=document.getElementById("tkErr"), ok=document.getElementById("tkOk"); e.textContent=""; ok.textContent="";
      var detail=document.getElementById("tkDetail").value.trim(); if(!detail) return e.textContent="Please describe the issue so we can help quickly.";
      go.disabled=true; go.textContent="Submitting…";
      post({action:"ticket",category:cat.value,warranty_category:(document.getElementById("tkWc")||{}).value||null,subject:document.getElementById("tkSubj").value.trim(),detail:detail})
      .then(function(j){ if(j.error){ e.textContent=j.error; go.disabled=false; go.textContent="Submit request"; return; } ok.textContent="Received — request #"+j.ticket_id+". We'll acknowledge within 24 hours."; setTimeout(load,900); })
      .catch(function(){ e.textContent="Network error — try again"; go.disabled=false; go.textContent="Submit request"; });
    };
    wrap.querySelectorAll("[data-apd]").forEach(function(b){ b.onclick=function(){
      var id=b.dataset.apd, dec=b.dataset.dec, ta=wrap.querySelector('[data-apc="'+id+'"]'), e=wrap.querySelector('[data-ape="'+id+'"]'); var c=(ta.value||"").trim(); e.textContent="";
      if(dec==="changes_requested"&&!c) return e.textContent="Please tell us what you'd like changed.";
      if(dec==="approved"&&!confirm("Approve “"+b.closest(".ap").querySelector("b").textContent+"”? Your team will proceed on this basis.")) return;
      b.disabled=true; post({action:"approval",approval_id:Number(id),decision:dec,comment:c}).then(function(j){ if(j.error){ e.textContent=j.error; b.disabled=false; return; } load(); }); }; });
    var hoGo=document.getElementById("hoGo"); if(hoGo) hoGo.onclick=function(){ var n=document.getElementById("hoName").value.trim(), e=document.getElementById("hoErr"); e.textContent=""; if(!n) return e.textContent="Please type your name to sign."; hoGo.disabled=true;
      post({action:"handover_sign",name:n}).then(function(j){ if(j.error){ e.textContent=j.error; hoGo.disabled=false; return; } load(); }); };
    wrap.querySelectorAll("[data-tks]").forEach(function(b){ b.onclick=function(){ var ta=wrap.querySelector('[data-tkn="'+b.dataset.tks+'"]'); var body=(ta.value||"").trim(); if(!body) return; b.disabled=true;
      post({action:"ticket_note",ticket_id:Number(b.dataset.tks),body:body}).then(function(j){ if(j.error){ alert(j.error); b.disabled=false; return; } load(); }); }; });
  }
  load();
  setInterval(function(){ if(D&&D.unlocked&&(TAB==="team"||TAB==="support")) load(); }, 45000);
})();
</script>
</body>
</html>
